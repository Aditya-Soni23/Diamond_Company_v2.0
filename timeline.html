<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Diamond Empire History</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030308;
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --glass: rgba(255, 255, 255, 0.03);
            --line-dim: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        /* Scanline Effect */
        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            z-index: 100;
            pointer-events: none;
        }

        header {
            height: 50vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
        }

        h1 {
            font-size: 4rem;
            letter-spacing: 15px;
            text-shadow: 0 0 20px var(--neon-blue);
            color: #fff;
            margin-bottom: 20px;
        }

        .container {
            position: relative;
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 0;
        }

        /* The Vertical Track */
        .main-track {
            position: absolute;
            top: 0; bottom: 0; left: 50%;
            width: 4px;
            background: var(--line-dim);
            transform: translateX(-50%);
        }

        #progress-fill {
            position: absolute;
            top: 0; left: 50%;
            width: 4px;
            height: 0%;
            background: linear-gradient(to bottom, var(--neon-blue), var(--neon-pink));
            transform: translateX(-50%);
            box-shadow: 0 0 20px var(--neon-blue);
            z-index: 2;
        }

        /* The Airplane */
        #airplane {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translate(-50%, -50%);
            z-index: 10;
            filter: drop-shadow(0 0 10px var(--neon-blue));
            transition: transform 0.2s ease;
        }

        /* Milestone Styling */
        .milestone {
            position: relative;
            width: 100%;
            margin-bottom: 120px;
            display: flex;
            justify-content: center;
        }

        .content-box {
            width: 40%;
            padding: 30px;
            background: var(--glass);
            border: 1px solid var(--line-dim);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            position: relative;
            transition: 0.5s;
            opacity: 0.3;
            transform: translateY(50px);
        }

        .milestone.left .content-box { margin-right: 55%; }
        .milestone.right .content-box { margin-left: 55%; }

        /* Connection Lines */
        .content-box::before {
            content: '';
            position: absolute;
            top: 50%;
            width: 50px;
            height: 2px;
            background: var(--line-dim);
            transition: 0.5s;
        }

        .milestone.left .content-box::before { right: -50px; }
        .milestone.right .content-box::before { left: -50px; }

        /* Active State */
        .milestone.active .content-box {
            opacity: 1;
            transform: translateY(0);
            border-color: var(--neon-blue);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
        }

        .milestone.active .content-box::before {
            background: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        .year {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--neon-pink);
            margin-bottom: 5px;
            text-shadow: 0 0 10px var(--neon-pink);
        }

        h3 { color: var(--neon-blue); text-transform: uppercase; letter-spacing: 2px; }
        p { margin-top: 10px; color: #ccc; line-height: 1.6; }

        @media (max-width: 768px) {
            .main-track, #progress-fill, #airplane { left: 20px; }
            .milestone.left .content-box, .milestone.right .content-box {
                width: 80%;
                margin-left: 60px;
                margin-right: 0;
            }
            .milestone.left .content-box::before, .milestone.right .content-box::before {
                left: -40px;
                width: 40px;
            }
        }
    </style>
</head>
<body>
    <button onclick="window.location.href='index.html'"
  style="
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #0f172a;
    color: white;
    font-size: 14px;
    cursor: pointer;
  ">
  ← Back to Home
</button>


    <header>
        <h1>The Diamond Empire History</h1>
        <p style="color: var(--neon-pink)">ALTITUDE: STABLE || STATUS: ARCHIVING</p>
    </header>

    <div class="container">
        <div class="main-track"></div>
        <div id="progress-fill"></div>
        
        <div id="airplane">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#00f3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 2L11 13"></path>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </div>

        <div id="milestone-list"></div>
    </div>

    <script>
 const historyData = [
  { 
    year: "2019", 
    title: "Liftoff", 
    desc: "Hello World! I'm Aditya Soni. I was 10 when I began my coding journey on my sister's recommendation. I joined WhiteHat Jr., where I created my first company name and designed my very first logo." 
  },

  { 
    year: "2020", 
    title: "Digital Shift", 
    desc: "This year, I finalized my company name and designed its revolutionary official logo. I gained significant knowledge in coding and freelancing while deeply exploring the world of computers." 
  },

  { 
    year: "2021", 
    title: "Logic Core", 
    desc: "This was a slower year, but I continued learning and strengthening my coding fundamentals." 
  },

  { 
    year: "2022", 
    title: "Visual Edge", 
    desc: "By this time, I had learned multiple programming languages including HTML, CSS, JavaScript, C++, Python, and Lua. I gained experience in app development, web development, and worked with tools like VS Code, Spyder, Anaconda, Jupyter Notebook, Thunkable, Tinkercad, and more." 
  },

  { 
    year: "2023", 
    title: "Cyber-Theme", 
    desc: "I launched my official company website and became a certified full-stack developer. By now, I had mastered professional website development." 
  },

  { 
    year: "2024", 
    title: "Expanding", 
    desc: "I began developing games on Roblox, Core, and other platforms, gaining real-world experience. I also joined an entrepreneurship program where my idea of building an autonomous robot was born." 
  },

  { 
    year: "2025", 
    title: "The First Flight", 
    desc: "I joined PhysicsWallah and started preparing seriously for JEE. I sold a website and a 3D model to clients, officially earning ₹1616 for my company. I also committed to continuing my autonomous robotics project in the future." 
  },

  { 
    year: "2026", 
    title: "The Flight", 
    desc: "I am continuously learning new technologies and improving my coding skills while preparing for JEE." 
  }
];


        const list = document.getElementById('milestone-list');
        historyData.forEach((item, i) => {
            const side = i % 2 === 0 ? 'left' : 'right';
            list.innerHTML += `
                <div class="milestone ${side}" id="milestone-${i}">
                    <div class="content-box">
                        <div class="year">${item.year}</div>
                        <h3>${item.title}</h3>
                        <p>${item.desc}</p>
                    </div>
                </div>
            `;
        });

        const progressFill = document.getElementById('progress-fill');
        const airplane = document.getElementById('airplane');
        const milestones = document.querySelectorAll('.milestone');

        window.addEventListener('scroll', () => {
            const container = document.querySelector('.container');
            const scrollPercent = (window.scrollY - container.offsetTop + (window.innerHeight / 2)) / container.offsetHeight * 100;
            const clampedPercent = Math.max(0, Math.min(scrollPercent, 100));

            // Update Line & Airplane
            progressFill.style.height = clampedPercent + "%";
            airplane.style.top = clampedPercent + "%";
            
            // Rotation effect for the airplane
            const rotation = clampedPercent > 0.5 ? 180 : 0; 
            airplane.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;

            // Activation logic
            milestones.forEach(m => {
                const rect = m.getBoundingClientRect();
                if(rect.top < window.innerHeight / 1.8) {
                    m.classList.add('active');
                } else {
                    m.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
